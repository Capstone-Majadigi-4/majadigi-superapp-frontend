name: majadigi_admin
description: Admin Panel Majadigi Super App - Jawa Timur

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Navigasi & State Management
  go_router: ^13.0.0
  provider: ^6.1.2
  # UI
  fl_chart: ^0.68.0
  data_table_2: ^2.5.12
  file_picker: ^8.0.3
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
 